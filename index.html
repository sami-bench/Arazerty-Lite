<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arazerty : Azerty B Darija! [LITE]</title>
</head>
<style>
    :root {
        --bg-color: #780047;
        --text-color: #e0e0e0;
        --primary-color: #8e0771;
        --secondary-color: #de61e6;
        --accent-color: #ffffff;
        --border-radius: 10px;
    }

    body {
        width: 400px;
        margin: 0 auto;
        padding: 10px;
        background: var(--bg-color);
        color: var(--text-color);
        font-family: "Segoe UI", system-ui;
        direction: rtl;
    }

    .help-canvas {
        position: fixed;
        top: -300px;
        left: 50%;
        transform: translateX(-50%);
        width: 400px;
        background: #1f4638;
        border: 3px solid #c98013;
        border-top: none;
        color: var(--text-color);
        padding: 0px 20px 20px 20px;
        border-radius: 0px 0px 12px 12px;
        box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.3);
        transition: top 0.3s ease-in-out;
        z-index: 1000;
    }

    .row-keys {
        display: inline-flex;
        padding: 8px;
        font-weight: 700;
        border-right: 1px solid #ffffff;
    }

    .help-canvas.visible {
        top: 0;
        /* Afficher le canevas */
    }


    .converter-box {
        background: rgba(0, 0, 0, 0.4);
        padding: 15px;
        border-radius: var(--border-radius);
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .counters {
        margin: 10px 0;
        font-size: 0.9em;
        color: #eaeaea;
    }

    form {
        display: flex;
    }

    textarea {
        font-weight: 700;
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid var(--primary-color);
        border-radius: var(--border-radius);
        color: var(--text-color);
        font-size: 16px;
        resize: vertical;
        transition: all 0.3s ease;
    }

    textarea:focus {
        outline: none;
        border-color: var(--accent-color);
        box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
    }

    textarea::placeholder {
        color: rgba(255, 255, 255, 0.4);
        font-weight: 400;
    }

    .btn-group {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
        gap: 8px;
        margin: 15px 0;
    }

    .btn {
        padding: 12px;
        background: rgba(30, 0, 20, 0.8);
        border: 1px solid var(--primary-color);
        border-radius: 8px;
        color: var(--text-color);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        gap: 8px;
    }

    .btn:hover {
        background: var(--primary-color);
        border-color: var(--secondary-color);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
    }

    .btn:active {
        transform: translateY(0);
    }

    .pro-btn {
        background: linear-gradient(135deg, #22e662, #038a33);
        border: none;
        color: #000;
        box-shadow: 0 4px 10px rgba(3, 138, 51, 0.3);
    }

    .pro-btn:hover {
        background: linear-gradient(135deg, #2cf573, #04a53d);
        box-shadow: 0 6px 20px rgba(3, 138, 51, 0.5);
        transform: translateY(-2px);
    }

    .footer {
        text-align: center;
        margin-top: 15px;
        font-size: 0.85em;
        color: rgba(255, 255, 255, 0.7);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 15px;
    }

    .contact-section {
        padding-top: 10px;
    }

    .contact-btn {
        background: rgba(255, 255, 255, 0.1) !important;
        border: 1px solid rgba(255, 255, 255, 0.3) !important;
        margin-top: 10px;
        text-decoration: none;
        font-size: 0.9em;
        transition: all 0.3s ease;
    }

    .contact-btn:hover {
        background: rgba(255, 255, 255, 0.2) !important;
        border-color: var(--accent-color) !important;
    }

    .hosted-by {
        margin-top: 8px;
        font-size: 0.9em;
        opacity: 0.8;
    }

    a {
        color: #fff;
        font-weight: 700;
        transition: color 0.3s ease;
    }

    .footer a {
        color: #fff;
        transition: color 0.3s ease;
    }

    .close-help {
        position: absolute;
        top: 5px;
        right: 10px;
        background: none;
        border: none;
        color: #fff;
        font-size: 24px;
        cursor: pointer;
        transition: transform 0.2s ease, color 0.2s ease;
        line-height: 1;
        padding: 5px;
        z-index: 1001;
    }

    .close-help:hover {
        transform: scale(1.2) rotate(90deg);
        color: #ff4d4d;
    }
</style>

<body>

    <div class="converter-box">
        <center>Arazerty : Azerty B Darija [Lite Version]</center>
        <form name="conversion">
            <textarea spellcheck="false" name="SamiBenchehidaAkaSampix" id="bar" rows="3"
                placeholder="ktb b clavier azerty ghayban bl3arbiya"></textarea>
        </form>

        <div class="btn-group">
            <button class="btn" id="copyButton">Copy All [CTRL+C] 🖊️</button>
        </div>

        <div class="btn-group">
            <button class="btn" id="HelpKeys">Help ❔</button>
            <button class="btn pro-btn" id="proButton">Full version ↗️</button>
        </div>
    </div>

    <div id="hosted-placeholder"></div>

    <div id="helpCanvas" class="help-canvas">
        <button class="close-help" id="closeHelp" title="Close">×</button>
        <h3 style="text-align: center; margin-top: 10px;">Shortcut keyboard ⌨</h3>
        <div class="row-keys">
            w/o → و <br />
            o' → ؤ <br />
            A' → ئ <br />
            A → ى <br />
        </div>
        <div class="row-keys">
            f → ف <br />
            ç/( → ق <br />
            k → ك <br />
            l → ل <br />
            m → م <br />
            n → ن <br />
            h → ه <br />
            aa → آ <br />
        </div>
        <div class="row-keys">
            j → ج <br />
            è/& → ح <br />
            kh → خ <br />
            T → ط <br />
            T' → ظ <br />
            "/# → ع <br />
            gh → غ <br />
            a' → أ <br />
        </div>
        <div class="row-keys">
            s → س<br />
            ch → ش <br />
            S → ص <br />
            d → د <br />
            'd → ذ <br />
            b → ب <br />
            t' → ث <br />
            à → ة <br />
        </div>
        <div class="row-keys">
            a → ا <br />
            z → ز <br />
            e → إ <br />
            r → ر<br />
            t → ت<br />
            y/i → ي<br />
            D → ض <br />
            é → ء <br />
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
